name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的已有标签，例如 v1.2.3 或 v1.2.3.1"
        required: true
        type: string
      release_description:
        description: "发行说明（可留空以自动生成）"
        required: false
        type: string
      artifact_run_id:
        description: "仅重试上传：填写同一标签已成功构建的运行 ID；正常发布留空"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - name: 验证发布标签
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            echo '::error::发布标签必须为 v1.2.3 或 v1.2.3.4 形式。'
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$ARTIFACT_RUN_ID" && ! "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::构建运行 ID 必须是数字。'
            exit 1
          fi
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=CPUSetSetter-zh-release-%s\n' "${source_sha:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: ${{ !inputs.artifact_run_id }}
    uses: ./.github/workflows/build_windows.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      build_installer: true
      artifact_name: CPUSetSetter-zh-release

  release:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.artifact_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: 下载已验证的构建产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: release_files
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: 核对版本并上传发行文件
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_DESCRIPTION: ${{ inputs.release_description }}
        shell: bash
        run: |
          set -euo pipefail
          repository='yukaichao-ai/CPUSetSetter_zh'
          test "$GITHUB_REPOSITORY" = "$repository"
          current_sha=$(gh api "repos/$repository/commits/$RELEASE_TAG" --jq .sha)
          test "$current_sha" = "$EXPECTED_SHA"
          source_url=$(python3 -c 'from pathlib import Path; print(Path("release_files/SOURCE.txt").read_text(encoding="utf-8-sig").strip())')
          test "$source_url" = "https://github.com/$repository/commit/$EXPECTED_SHA"
          files=()
          for name in CPUSetSetter_Installer.exe CPUSetSetter_zh_win-x64.zip CPUSetSetter_zh_win-x64_net10_included.zip SOURCE.txt SHA256SUMS.txt; do
            test -s "release_files/$name"
            files+=("release_files/$name")
          done
          notes_file=$(mktemp)
          printf '%s\n' "$RELEASE_DESCRIPTION" > "$notes_file"
          if gh release view "$RELEASE_TAG" --repo "$repository" >/dev/null 2>&1; then
            # An existing tag already identifies the source. Do not update target_commitish.
            if [[ -n "$RELEASE_DESCRIPTION" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$repository" --notes-file "$notes_file"
            fi
          elif [[ -n "$RELEASE_DESCRIPTION" ]]; then
            gh release create "$RELEASE_TAG" --repo "$repository" --verify-tag --title "$RELEASE_TAG 中文版" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" --repo "$repository" --verify-tag --title "$RELEASE_TAG 中文版" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$repository" --clobber
          printf '### 发行文件已上传\n\n[打开 %s 中文版](https://github.com/%s/releases/tag/%s)\n\n源码提交：`%s`\n' "$RELEASE_TAG" "$repository" "$RELEASE_TAG" "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
