name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的已有标签，例如 v1.2.3 或 v1.2.3.1"
        required: true
        type: string
      release_description:
        description: "发行说明（可留空以自动生成）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 验证发布标签
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            echo '::error::发布标签必须为 v1.2.3 或 v1.2.3.4 形式。'
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build_windows.yml
    with:
      ref: refs/tags/${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      build_installer: true
      artifact_name: CPUSetSetter-zh-release

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载已验证的构建产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release_files

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.commit_sha }}
          body: ${{ inputs.release_description }}
          generate_release_notes: ${{ !inputs.release_description }}
          fail_on_unmatched_files: true
          files: release_files/*
