name: Build Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch_name:
        description: "要构建的分支、标签或提交 SHA"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.branch_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build_windows.yml
    with:
      ref: ${{ inputs.branch_name || github.sha }}
      artifact_name: CPUSetSetter-zh-preview
